      <stop offset="0%" stop-color="#f3f3f3"/>
      <stop offset="100%" stop-color="#dddddd"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#888" flood-opacity="0.25"/>
